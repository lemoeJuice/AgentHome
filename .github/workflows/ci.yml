name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.5.x
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.26.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - run: for file in scripts/*.sh; do bash -n "$file"; done
      - run: git diff --check
